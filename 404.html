<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    /* Switch to English layout before the page draws, if the visitor chose English */
    try {
      var l = new URLSearchParams(location.search).get("lang") || localStorage.getItem("sula-lang");
      if (l === "en") { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; }
    } catch (e) {}
  </script>
  <title data-i18n="title.404">Sula Products</title>
  <meta name="description" content="" data-i18n-attr="content:desc.404">
  <meta name="theme-color" content="#FFFFFF">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sula Products">
  <meta property="og:title" content="Sula Products">
  <meta property="og:image" content="images/site/hero.svg">
  <meta property="og:locale" content="ar_OM">
  <meta property="og:locale:alternate" content="en_US">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="images/app/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Sula">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Montserrat:wght@500;600;700;800&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">انتقلي إلى المحتوى</a>

  <div class="announce" role="note">
    <div class="announce-track">
      <p data-i18n="announce.1">اطلبي بسهولة عبر واتساب</p>
      <p data-i18n="announce.2"></p>
      <p data-i18n="announce.3"></p>
    </div>
  </div>

  <header class="site-header">
    <div class="wrap header-main">
      <a class="header-search" href="products.html#search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><span data-i18n="nav.search">ابحثي عن منتج</span></a>
      <a class="logo" href="index.html">
        <span data-brand-name>Sula Products</span>
        <small data-brand-tagline></small>
      </a>
      <div class="header-tools">
        <button type="button" class="lang-toggle" data-lang-toggle data-i18n="lang.button" data-i18n-attr="aria-label:lang.aria">English</button>
        <a class="cart-link" href="cart.html"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 8h14l-1.2 12.1a1 1 0 0 1-1 .9H7.2a1 1 0 0 1-1-.9L5 8Z"/><path d="M9 8V6.5a3 3 0 0 1 6 0V8"/></svg><span class="visually-hidden" data-i18n="nav.cart">السلة</span><span class="cart-count"><span data-cart-count>0</span><span class="visually-hidden" data-i18n="nav.items"> قطعة</span></span></a>
      </div>
    </div>
    <nav class="cat-nav" aria-label="القائمة الرئيسية" data-i18n-attr="aria-label:nav.label">
      <ul class="wrap" data-cat-nav>
        <li><a href="index.html" data-i18n="nav.home" data-nav="home">الرئيسية</a></li>
        <li><a href="products.html" data-i18n="nav.all" data-nav="all">كل المنتجات</a></li>
      </ul>
    </nav>
  </header>

  <main id="main" class="wrap" tabindex="-1">
    <div id="notices" class="notice-stack" aria-live="polite"></div>
    <div class="empty-state">
      <h1 data-i18n="404.title"></h1>
      <p data-i18n="404.text"></p>
      <a class="btn btn-primary" href="products.html" data-i18n="home.cta"></a>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap footer-grid">
      <div class="footer-brand">
        <p class="footer-logo" data-brand-name>Sula Products</p>
        <p class="footer-hello" data-i18n="footer.hello">خلّينا نبقى على تواصل</p>
        <p data-i18n="footer.orders"></p>
        <p class="footer-social"><a class="btn btn-outline-light" data-instagram-link href="https://www.instagram.com/sula__products/" target="_blank" rel="noopener">Instagram @sula__products</a></p>
      </div>
      <div class="footer-col">
        <p class="footer-head" data-i18n="footer.shop">تسوّقي</p>
        <ul data-footer-cats>
          <li><a href="products.html" data-i18n="nav.all">كل المنتجات</a></li>
        </ul>
      </div>
      <div class="footer-col">
        <p class="footer-head" data-i18n="footer.help">المساعدة</p>
        <ul>
          <li><a href="index.html#how" data-i18n="home.steps">طريقة الطلب</a></li>
          <li><a href="cart.html" data-i18n="nav.cart">السلة</a></li>
        </ul>
      </div>
    </div>
    <div class="wrap footer-bottom">
      <p>© <span data-year></span> Sula Products · <span data-brand-tagline></span></p>
    </div>
  </footer>

  <!-- i18n.js runs first (not deferred) so the text is translated before it shows -->
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/common.js" defer></script>
  <script src="assets/js/notfound.js" defer></script>
</body>
</html>
