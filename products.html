<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    /* Switch to English layout before the page draws, if the visitor chose English */
    try {
      var l = new URLSearchParams(location.search).get("lang") || localStorage.getItem("sula-lang");
      if (l === "en") { document.documentElement.lang = "en"; document.documentElement.dir = "ltr"; }
    } catch (e) {}
  </script>
  <title data-i18n="title.products">Sula Products</title>
  <meta name="description" content="" data-i18n-attr="content:desc.products">
  <meta name="theme-color" content="#FFFAF8">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Sula Products">
  <meta property="og:title" content="Sula Products">
  <meta property="og:image" content="images/site/hero.svg">
  <meta property="og:locale" content="ar_OM">
  <meta property="og:locale:alternate" content="en_US">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Noto+Naskh+Arabic:wght@600&family=Cormorant+Garamond:wght@600&display=swap">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main" data-i18n="skip">انتقلي إلى المحتوى</a>

  <header class="site-header">
    <div class="wrap">
      <a class="logo" href="index.html">
        <span data-brand-name>Sula Products</span>
        <small data-brand-tagline></small>
      </a>
      <nav class="main-nav" aria-label="القائمة الرئيسية" data-i18n-attr="aria-label:nav.label">
        <ul>
          <li><a href="index.html" data-i18n="nav.home">الرئيسية</a></li>
          <li><a href="products.html" data-i18n="nav.products" aria-current="page">المنتجات</a></li>
          <li><a href="cart.html"><span data-i18n="nav.cart">السلة</span> <span class="cart-count"><span data-cart-count>0</span><span class="visually-hidden" data-i18n="nav.items"> قطعة</span></span></a></li>
          <li><button type="button" class="lang-toggle" data-lang-toggle data-i18n="lang.button" data-i18n-attr="aria-label:lang.aria">English</button></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main" class="wrap" tabindex="-1">
    <div id="notices" class="notice-stack" aria-live="polite"></div>
    <div class="catalog-head">
      <div class="catalog-title">
        <h1 data-i18n="catalog.title"></h1>
        <p class="muted" data-i18n="catalog.subtitle"></p>
      </div>
      <div class="search-field">
        <label for="search" data-i18n="catalog.search"></label>
        <input id="search" type="search" autocomplete="off" data-i18n-attr="placeholder:catalog.placeholder">
      </div>
      <div class="chips" id="category-filters" role="group" data-i18n-attr="aria-label:catalog.filter"></div>
    </div>
    <p class="results-count" id="results-count" role="status" aria-live="polite"></p>
    <ul id="product-list" class="product-grid">
        <li class="product-card skeleton" aria-hidden="true"><div class="thumb"></div><div class="bar"></div><div class="bar short"></div></li>
        <li class="product-card skeleton" aria-hidden="true"><div class="thumb"></div><div class="bar"></div><div class="bar short"></div></li>
        <li class="product-card skeleton" aria-hidden="true"><div class="thumb"></div><div class="bar"></div><div class="bar short"></div></li>
        <li class="product-card skeleton" aria-hidden="true"><div class="thumb"></div><div class="bar"></div><div class="bar short"></div></li>
    </ul>
    <div id="no-results" class="empty-state" hidden>
      <p data-i18n="catalog.empty"></p>
      <button type="button" class="btn btn-secondary" id="clear-filters" data-i18n="catalog.showAll"></button>
    </div>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p><strong data-brand-name>Sula Products</strong> · <span data-brand-tagline></span></p>
      <p data-i18n="footer.orders"></p>
      <p><a data-instagram-link href="https://www.instagram.com/sula__products/" target="_blank" rel="noopener">Instagram @sula__products</a></p>
      <p class="muted">© <span data-year></span> Sula Products</p>
    </div>
  </footer>

  <!-- i18n.js runs first (not deferred) so the text is translated before it shows -->
  <script src="assets/js/i18n.js"></script>
  <script src="assets/js/common.js" defer></script>
  <script src="assets/js/catalog.js" defer></script>
</body>
</html>
